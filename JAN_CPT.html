  const reimb = (m.funding || []).filter(f => (m.reimbursableSources || []).includes(f.source)).reduce((s, f) => s + (Number(f.amount) || 0), 0);

};

// A project can carry several grants, each with its own checklist — two FAA AIG
// grants plus an MDOT matching grant, for example, and MDOT does not require
// sponsor certifications or quarterly reports. Sections are per-project data,
// not a fixed list, so each grant is tracked separately.
const MDOT_MILESTONES = ["Grant Awarded", "Grant Executed", "Quarterly Reports Submitted", "Final Inspection Complete", "Closeout Package Submitted"];

// Quarterly reports are submitted four times a year, so they are tracked
// individually rather than as one checkbox — this is what the quarterly
// reporting cycle actually looks like.
const QUARTERS = ["Q1", "Q2", "Q3", "Q4"];
const GRANT_TEMPLATES = {
  "FAA AIP": GRANT_MILESTONES,
  "FAA AIG": GRANT_MILESTONES,
  "MDOT AIP-Matching": MDOT_MILESTONES,
  "Custom": []
};

const LEGACY_FAA_MILESTONES = {
  "Application Submitted": "Application for Federal Assistance Submitted",
  "Grant Awarded": "Grant Award Received",
  "Grant Executed": "Executed Grant Agreement",
  "Sponsor Certifications Submitted": "Sponsor Certification and Lobbying Certification Submitted",
  "Final Acceptance Letter": "Final Acceptance",
  "Closeout Package Submitted": "Project Closeout Package Submitted",
  "Closeout Approved": "Final Grant Closeout Correspondence Received from FAA"
};

function currentFaaSection(section) {
  if (!section || !/^FAA A(?:IP|IG)$/i.test(section.type || "")) return section;
  const done = { ...(section.done || {}) };
  const completionDates = { ...(section.completionDates || {}) };
  Object.entries(LEGACY_FAA_MILESTONES).forEach(([oldName, newName]) => {
    if (done[oldName] && done[newName] == null) done[newName] = true;
    if (completionDates[oldName] && !completionDates[newName]) completionDates[newName] = completionDates[oldName];
  });
  return { ...section, items: GRANT_MILESTONES, done, completionDates };
}

// Older projects stored a single flat { milestones: {...} } map. Convert that to
// one FAA section so nothing already entered is lost.
function grantSections(grant) {
  if (grant && Array.isArray(grant.sections) && grant.sections.length) return grant.sections.map(currentFaaSection);
  const legacy = grant && grant.milestones || {};
  return [{
    id: "faa-1",
    name: "FAA AIG Grant Administration",
    type: "FAA AIG",
    items: GRANT_MILESTONES,
    done: legacy,
    completionDates: grant && grant.milestoneDates || {},
    grantNo: "",
    popEnd: ""
  }];
}

// "Quarterly Reports Submitted" expands into four separate checkboxes so each
// submission is tracked on its own.
function expandItems(items) {
  const out = [];
  (items || []).forEach(m => {
    if (/^quarterly reports submitted$/i.test(m)) {
      QUARTERS.forEach(q => out.push(`Quarterly Report — ${q}`));
    } else out.push(m);
  });
  return out;
}

function localTodayISO() {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

const fmtCompact = n => {

function requestWithTimeout(request, label = "Save", ms = 15000) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + " timed out. Check your connection and try again.")), ms);
  });
  return Promise.race([request, timeout]).finally(() => clearTimeout(timer));
}

/* ================= styles ================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --blue:#0B3D6E;--blue-2:#0E4E8C;--sky:#2E9BD6;--sky-lt:#BFE3F5;--gold:#F2A900;
  --red:#C62828;--amber:#E9A100;--green:#2E7D52;
  --bg:#EEF4F9;--panel:#FFFFFF;--line:#D7E2EC;--ink:#16232F;--dim:#5D6B78;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',Arial,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace;
  --r:12px;--shadow:0 2px 10px rgba(11,61,110,.08);
}
*{box-sizing:border-box;margin:0}
.app{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
@keyframes drift{0%{transform:translateX(-140px)}100%{transform:translateX(calc(100vw + 140px))}}
@keyframes sheen{0%{left:-220px}45%{left:110%}100%{left:110%}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes alertPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 7px rgba(198,40,40,.16)}}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.fade-in{animation:fadeIn .28s ease both}
.rise{animation:riseIn .45s cubic-bezier(.2,.7,.3,1) both}
.pop-in{animation:popIn .3s cubic-bezier(.2,.7,.3,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hdr{background:linear-gradient(160deg,var(--blue) 0%,var(--blue-2) 55%,#1668B0 100%);color:#fff;position:relative;overflow:hidden;transition:background .5s}
.hdr-stop{background:linear-gradient(160deg,#7A1414 0%,#A32020 55%,#C62828 100%)}
.hdr::after{content:"";position:absolute;top:0;bottom:0;left:-220px;width:200px;background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.hdr-sky{position:absolute;inset:0;pointer-events:none}
.hdr-plane{position:absolute;top:26px;font-size:20px;color:rgba(255,255,255,.75);animation:drift 28s linear infinite}
.hdr-plane2{top:58px;font-size:13px;opacity:.55;animation-duration:42s;animation-delay:-16s}
.cloud{position:absolute;background:rgba(255,255,255,.10);border-radius:999px;filter:blur(1px)}
.c1{width:180px;height:34px;top:16px;left:8%;animation:cloudDrift 14s ease-in-out infinite alternate}
.c2{width:120px;height:24px;top:52px;left:55%;animation:cloudDrift 18s ease-in-out infinite alternate-reverse}
.c3{width:220px;height:40px;top:8px;left:74%;animation:cloudDrift 22s ease-in-out infinite alternate}
.hdr-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px 12px;flex-wrap:wrap;position:relative}
.hdr-brand{display:flex;gap:14px;align-items:center}
.brand-mark{width:52px;height:52px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:var(--shadow);flex:none}
.brand-j{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--blue)}
.brand-swoosh{position:absolute;bottom:9px;left:10px;right:10px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--sky),var(--gold))}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--sky-lt)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1.05}
.sub{color:#CFE3F2;font-size:12px;margin-top:3px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.save-chip{font-size:11px;color:#BFD9EC;min-height:15px}
.tabs{display:flex;gap:4px;padding:8px 24px 0;flex-wrap:wrap;position:relative}
.tab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:14px;font-weight:600;background:rgba(255,255,255,.10);color:#D8E8F4;border:0;padding:9px 18px;cursor:pointer;border-radius:10px 10px 0 0;transition:background .2s,transform .15s}
.tab:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
.tab.on{background:var(--bg);color:var(--blue);position:relative}
.tab.on::after{content:"";position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:3px;background:var(--gold)}
.tab .count.red{background:var(--red);color:#fff;border-radius:999px;padding:0 8px;margin-left:7px;font-size:12px;font-family:var(--body);font-weight:700}

.ticker{display:flex;background:#082A4E;color:#D8E8F4;overflow:hidden}
.ticker-label{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.12em;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 14px;flex:none;border-right:2px solid var(--gold);animation:livePulse 1.8s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.6}}
.ticker-clip{overflow:hidden;flex:1}
.ticker-track{display:inline-flex;white-space:nowrap;animation:tickerScroll linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{padding:7px 0 7px 30px;font-size:12.5px}
.ticker-item::after{content:"•";margin-left:30px;color:var(--gold)}

.stopbar{background:#9E1B1B;color:#fff;animation:slideDown .35s ease both,stopBreath 3s ease-in-out .4s infinite;border-bottom:3px solid #7A1414;border-top:3px solid #7A1414}
@keyframes stopBreath{0%,100%{background:#9E1B1B}50%{background:#AD2020}}
.stopbar-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;gap:15px;align-items:center}
.stop-title{font-family:var(--disp);font-weight:700;letter-spacing:.09em;font-size:17px}
.stop-body{font-size:12.5px;color:#FFE0E0;margin-top:2px}

main{max-width:1080px;margin:0 auto}

.badge{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:11px;padding:3px 11px;border-radius:999px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}

.gauges{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.gauge-wrap{text-align:center}
.gauge{width:100%;max-width:230px}
.gauge-val{font-family:var(--disp);font-weight:700;font-size:21px}
.gauge-label{font-weight:600;font-size:13.5px;margin-top:-4px}
.gauge-limit{font-size:11.5px;color:var(--dim);margin-bottom:7px}

.scurve{width:100%;height:auto}
.sc-axis{font-family:var(--mono);font-size:9px;fill:var(--dim)}
.sc-tag{font-family:var(--disp);font-weight:700;font-size:13px}
.sc-key{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.key-item{display:flex;align-items:center;gap:6px}
.key-swatch{width:14px;height:4px;border-radius:2px;display:inline-block}
.key-dash{width:18px;border-top:2.5px dashed #9BB6CE;display:inline-block}

.prog-track{height:22px;background:#F2F7FB;border-radius:999px;overflow:hidden;display:flex;position:relative}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--blue-2));transition:width .9s cubic-bezier(.2,.7,.3,1);position:relative;overflow:hidden}
.prog-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 2.2s linear infinite}
.prog-lost{height:100%;background:repeating-linear-gradient(45deg,#8E1616 0 7px,#C62828 7px 14px)}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;flex-wrap:wrap;gap:8px}

.tbl-wrap{overflow-x:auto}
.log{width:100%;border-collapse:collapse;font-size:12.5px}
.log th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:var(--blue);border-bottom:2px solid var(--blue);padding:7px 8px;text-align:left;white-space:nowrap}
.log td{border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:middle}
.log .r,.log th.r{text-align:right}
.log tbody tr{transition:background .15s}
.log tbody tr:hover{background:#F4F9FD}
.row-future{opacity:.55}
.row-breach{background:#FDF1F1}
.wk{font-family:var(--disp);font-weight:700;color:var(--blue);font-size:14px}
.log tfoot td{border-top:2px solid var(--blue);padding:9px 8px;font-size:13px}
.tf-label{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--blue)}
.cell-in{width:112px;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;background:#FBFDFE;font-family:var(--mono);font-size:12.5px;text-align:right;transition:border-color .15s,box-shadow .15s}
.cell-sm{width:58px}
.cell-note{width:190px;text-align:left;font-family:var(--body)}
.cell-in:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.18)}
.tip{margin-top:14px;background:#FFF6DE;border:1px solid #F0D492;border-left:5px solid var(--gold);border-radius:10px;padding:11px 15px;font-size:13px}

.split-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:14px}
.split-prime{background:linear-gradient(90deg,var(--blue),var(--blue-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;animation:riseIn .7s ease both}
.split-eng{background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:11px;font-weight:700;animation:riseIn .7s ease .15s both}
.contract-rows{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:1.4fr 1.4fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.crow b{color:var(--blue)}
.crow-total{border-bottom:0;border-top:2px solid var(--blue);font-weight:700;font-size:14.5px}
@media(max-width:640px){.crow{grid-template-columns:1fr auto}}

.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.team-card{background:#F7FBFE;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--r);padding:15px 17px;text-align:left;transition:transform .2s,box-shadow .2s}
.team-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(11,61,110,.14)}
.team-role{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.team-name{font-weight:700;color:var(--blue);font-size:14px;margin-top:2px}
.fund-chips{display:flex;gap:10px;flex-wrap:wrap}
.fund-chip{background:#E8F4EC;color:#1E5A3A;border:1.5px solid #A8D5BC;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px;transition:transform .2s}
.fund-chip:hover{transform:translateY(-2px)}

.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:13px;border:0;padding:10px 18px;cursor:pointer;border-radius:10px;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn-primary{background:var(--gold);color:var(--blue);box-shadow:0 2px 6px rgba(242,169,0,.35)}
.btn-ghost{background:none;color:var(--dim);border:1.5px solid var(--line)}
.btn-xs{padding:5px 12px;font-size:11px}
.btn-tutorial{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4)}

.tut-bg{position:fixed;inset:0;background:rgba(11,35,58,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:34px 16px;overflow:auto;z-index:20;animation:fadeIn .2s ease}
.tut-card{background:var(--panel);border-radius:18px;max-width:480px;width:100%;padding:28px 28px 22px;text-align:center;box-shadow:0 20px 60px rgba(11,35,58,.35);border-top:6px solid var(--sky)}
.tut-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.tut-card h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:22px;color:var(--blue);margin-bottom:8px}
.tut-card p{font-size:14px;color:#34424F;text-align:left;line-height:1.6}
.tut-dots{display:flex;gap:7px;justify-content:center;margin:18px 0 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:0;cursor:pointer;padding:0;transition:background .2s,transform .2s}
.dot-on{background:var(--gold);transform:scale(1.35)}
.tut-actions{display:flex;justify-content:space-between;gap:10px}

/* Animated how-to guides for project setup and the phone field workflow. */
.howto-bg{position:fixed;inset:0;z-index:1400;display:grid;place-items:center;padding:18px;
  background:rgba(5,24,45,.72);backdrop-filter:blur(7px);animation:fadeIn .2s ease}
.howto-card{position:relative;width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:24px;
  background:#fff;box-shadow:0 28px 90px rgba(2,18,34,.45);animation:howtoRise .42s cubic-bezier(.2,.8,.2,1)}
.howto-x{position:absolute;z-index:2;right:14px;top:13px;width:36px;height:36px;border:0;border-radius:50%;
  background:rgba(255,255,255,.9);color:#0B3D6E;font-size:25px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(3,24,42,.18)}
.howto-progress{display:flex;gap:5px;padding:17px 58px 11px 18px;background:#F7FAFD}
.howto-progress i{height:5px;flex:1;border-radius:999px;background:#D8E5EF;transition:background .3s,transform .3s}
.howto-progress i.on{background:linear-gradient(90deg,#2E9BD6,#F2A900);transform:scaleY(1.2)}
.howto-stage{height:190px;position:relative;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(145deg,#082D53,#0E5C93 62%,#2E9BD6);color:#fff}
.howto-stage::before,.howto-stage::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.howto-stage::before{width:210px;height:210px;left:-65px;top:-90px;animation:howtoFloat 5s ease-in-out infinite}
.howto-stage::after{width:150px;height:150px;right:-28px;bottom:-90px;animation:howtoFloat 6s ease-in-out -2s infinite}
.howto-orbit{position:absolute;width:138px;height:138px;border:1px dashed rgba(255,255,255,.42);border-radius:50%;animation:howtoSpin 12s linear infinite}
.howto-orbit::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#F2A900;top:9px;left:16px;box-shadow:0 0 18px #F2A900}
.howto-step-icon{position:absolute;left:22px;top:18px;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:#F2A900;color:#08355E;font:800 18px var(--disp);box-shadow:0 5px 15px rgba(0,0,0,.2)}
.howto-glyph{position:relative;z-index:1;width:94px;height:94px;display:grid;place-items:center;border-radius:25px;
  background:rgba(255,255,255,.96);color:#0B3D6E;font:800 25px var(--disp);letter-spacing:.04em;
  box-shadow:0 15px 35px rgba(0,16,34,.3);animation:howtoBob 2.7s ease-in-out infinite}
.howto-copy{padding:25px 27px 20px}.howto-eyebrow{color:#2E789F;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.howto-copy h2{margin:6px 0 9px;color:#0B3D6E;font:700 27px/1.08 var(--disp);text-transform:uppercase;letter-spacing:.025em}
.howto-copy p{margin:0;color:#42576A;font-size:15px;line-height:1.65}
.howto-actions{display:flex;justify-content:space-between;gap:11px;padding:0 27px 25px}
.howto-btn{min-height:46px;padding:11px 18px;border-radius:11px;font:700 13px var(--disp);letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.howto-btn.secondary{border:1px solid #CFDDE8;background:#fff;color:#597083}.howto-btn.primary{border:0;background:#F2A900;color:#0B3D6E;box-shadow:0 6px 16px rgba(202,139,0,.25)}
.howto-btn:hover{transform:translateY(-1px)}
.cloud-help-link{color:#F2C14F!important}.field-hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.field-help{color:#F6C34A!important}
.field-coach-layer{position:fixed;inset:0;z-index:1500;pointer-events:none}
.field-coach-ring{position:fixed;z-index:1;border:3px solid #F2A900;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(4,20,37,.18),0 0 0 6px rgba(242,169,0,.2),0 0 28px rgba(242,169,0,.8);animation:coachPulse 1.45s ease-in-out infinite}
.field-coach-card{position:fixed;z-index:2;width:min(360px,calc(100vw - 24px));padding:20px 20px 18px;border-radius:17px;background:#fff;
  box-shadow:0 18px 55px rgba(0,15,30,.4);pointer-events:auto;animation:howtoRise .3s ease}
.field-coach-close{position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:#EEF4F9;color:#526B80;font-size:21px;cursor:pointer}
.field-coach-count{padding-right:35px;color:#2E789F;font-size:10px;font-weight:800;letter-spacing:.12em}.field-coach-card h3{margin:5px 30px 7px 0;color:#0B3D6E;font:700 22px/1.1 var(--disp);text-transform:uppercase}
.field-coach-card p{margin:0;color:#496074;font-size:14px;line-height:1.55}.field-coach-wait{display:flex;align-items:center;gap:8px;margin-top:14px;color:#8A6414;font-size:12px;font-weight:700}
.field-coach-wait i{width:9px;height:9px;border-radius:50%;background:#F2A900;animation:fvPulse 1s ease-in-out infinite}.field-coach-next{margin-top:15px;width:100%;min-height:43px;border:0;border-radius:10px;background:#F2A900;color:#0B3D6E;font:700 13px var(--disp);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.field-coach-wait button{margin-left:auto;border:0;background:transparent;color:#0B5C88;font:700 11px var(--body);text-decoration:underline;cursor:pointer;padding:7px 2px}
@keyframes coachPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes howtoRise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes howtoSpin{to{transform:rotate(360deg)}}
@keyframes howtoBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes howtoFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(13px,8px)}}
@media(max-width:520px){.howto-bg{padding:0}.howto-card{width:100%;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column}.howto-stage{height:210px;flex:none}.howto-copy{padding:24px 20px 16px}.howto-copy h2{font-size:25px}.howto-actions{margin-top:auto;padding:12px 20px calc(22px + env(safe-area-inset-bottom))}.howto-btn{flex:1}.field-hdr-actions{gap:3px}.field-signout{font-size:12px;padding:8px 7px}}

.field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:3px;font-weight:600}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,0);background:var(--blue);color:#fff;font-family:var(--disp);font-size:15px;letter-spacing:.04em;padding:12px 22px;border-radius:999px;border:2px solid var(--gold);box-shadow:0 10px 30px rgba(11,35,58,.35);z-index:1000;animation:toastIn .3s ease both}

/* ---------- update panel ---------- */
.btn-update{background:var(--gold);color:var(--blue);border-color:var(--gold)}
.upd-card{background:var(--panel);border-radius:16px;max-width:760px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(11,35,58,.35);border-top:6px solid var(--gold);max-height:88vh;overflow:auto}
.upd-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.upd-head h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:20px;color:var(--blue)}
.upd-intro{font-size:12.5px;color:var(--dim);margin:6px 0 12px}
.upd-tabs{display:flex;gap:6px;margin-bottom:12px}

.upd-tab.on{background:var(--blue);color:#fff}
.upd-text{width:100%;min-height:140px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#FBFDFE;font-family:var(--mono);font-size:12.5px;line-height:1.65;resize:vertical}

.upd-json{font-size:11.5px;color:var(--green);font-weight:600}
.upd-errs{margin-top:12px;background:#FDF1F1;border:1px solid #EFC9C9;border-left:5px solid var(--red);border-radius:9px;padding:10px 13px;font-size:12.5px}
.upd-err{margin-top:5px;color:#7A1414}
.upd-errln{font-family:var(--mono);font-size:11px;background:#F5DADA;border-radius:4px;padding:1px 6px;margin-right:5px}
.upd-errtxt{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.upd-prev{margin-top:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.upd-prev-head{background:#F4F9FD;padding:8px 13px;font-size:12px;font-weight:600;color:var(--blue);display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--line)}
.upd-list{max-height:220px;overflow:auto}

.upd-item-d{color:var(--dim)}
.chip{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.06em;padding:2px 8px;border-radius:999px}

.chip-upd{background:var(--sky);color:#fff}
.upd-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}

/* ---------- header actions ---------- */
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn-file{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.btn-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ---------- pay applications ---------- */
.pa-card{background:#FBFDFE;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.pa-outstanding{border-left-color:var(--amber)}
.pa-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pa-num{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--blue);letter-spacing:.04em}
.pa-sum{font-size:12.5px;color:var(--dim)}
.pa-head .btn{margin-left:auto}
.pa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.pipeline{display:flex;align-items:flex-start;margin:4px 0 14px}
.pipe-step{flex:1;text-align:center;position:relative}
.pipe-step::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:3px;background:var(--line)}
.pipe-step:first-child::before{display:none}
.pipe-done::before{background:var(--green)}
.pipe-dot{position:relative;display:block;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 5px;transition:border-color .35s,background .35s}

.pipe-done .pipe-lbl{color:var(--green)}

/* ---------- board memo ---------- */
.memo-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.memo-hint{font-size:12px}
.memo{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:38px 44px;max-width:820px;margin:0 auto;animation:riseIn .45s cubic-bezier(.2,.7,.3,1) both}
.memo-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--blue);padding-bottom:14px;margin-bottom:20px;gap:16px}
.memo-logo{height:46px}
.memo-head-r{text-align:right}
.memo-kicker{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:11px;color:var(--blue);font-weight:700}
.memo-date{font-size:12px;color:var(--dim);margin-top:2px}
.memo-title{font-family:var(--disp);font-size:25px;font-weight:700;color:var(--blue);line-height:1.15;margin-bottom:10px}
.memo-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 22px;font-size:12.5px;color:#2A3844;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
@media(max-width:640px){.memo-meta{grid-template-columns:1fr}.memo{padding:24px 20px}}
.memo-h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:14px;color:var(--blue);font-weight:700;margin:20px 0 7px}
.memo-tbl{width:100%;border-collapse:collapse;font-size:13px}
.memo-tbl td{padding:6px 8px;border-bottom:1px solid #EAF1F7;vertical-align:top}
.memo-tbl tr:last-child td{border-bottom:none}
.memo-metric{width:46%;font-weight:600;color:#2A3844}
.memo-body{font-size:13px;line-height:1.6;color:#2A3844;margin-top:4px}
.memo-sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:34px;font-size:11.5px;color:var(--dim)}
@media(max-width:640px){.memo-sign{grid-template-columns:1fr}}
.sign-line{border-top:1px solid #6B7883;margin-bottom:5px;height:30px}
.memo-foot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim)}

/* ---------- print ---------- */
@media print{
  .hdr,.ticker,.stopbar,.ftr,.no-print,.tut-bg,.toast{display:none!important}
  body,.app{background:#fff!important}
  main{max-width:none}
  .pad{padding:0}
  .memo{border:none;box-shadow:none;padding:0;max-width:none;animation:none}
  .memo-h2{page-break-after:avoid}
  .memo-tbl{page-break-inside:avoid}
  .dot-ind{animation:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- executive summary ---------- */
.exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.exec-cell{display:flex;gap:10px;align-items:flex-start;background:#F7FBFE;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.exec-risk{border-color:var(--blue);background:#F1F6FB}
.dot-ind{width:12px;height:12px;border-radius:50%;flex:none;margin-top:3px}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red);animation:alertPulse 1.7s ease-in-out infinite}
.dot-swatch{display:inline-block;margin-right:7px;vertical-align:-1px;animation:none}
.exec-metric{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--blue)}
.exec-status{font-size:12px;color:var(--ink)}

/* ---------- grant & compliance ---------- */
.fund-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin-bottom:14px}
.fund-seg{animation:riseIn .7s ease both}
.ms-progress-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.progressbar{flex:1;height:10px;background:#F2F7FB;border-radius:999px;overflow:hidden}
.progressbar-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--green));border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1);position:relative;overflow:hidden}
.progressbar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 2.2s linear infinite}
.ms-count{font-size:13px;font-weight:600;color:var(--blue)}
.ms-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
@media(max-width:700px){.ms-list{grid-template-columns:1fr}}
.ms-row{display:flex;gap:10px;align-items:center;padding:8px 4px;font-size:13.5px;border-bottom:1px solid var(--line);transition:background .15s}
.ms-row:hover{background:#F4F9FD}
.ms-row>input{accent-color:var(--blue);width:16px;height:16px;flex:none;cursor:pointer}
.ms-num{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.ms-label{flex:1;min-width:120px;color:var(--ink);line-height:1.35}
.ms-done .ms-label{color:var(--dim)}
.ms-done .ms-num{color:var(--green)}
.ms-date{flex:none;display:flex;align-items:center;justify-content:flex-end;min-width:132px}
.ms-date input{width:132px;box-sizing:border-box;padding:5px 7px;border:1px solid var(--line);border-radius:7px;
  background:#fff;color:#5A6B7C;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer}
.ms-date input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.ms-done .ms-date input{border-color:#B9E3C6;background:#EEF8F1;color:#2E7D52}
@media(max-width:520px){.ms-row{flex-wrap:wrap}.ms-label{min-width:calc(100% - 58px)}.ms-date{margin-left:58px}}
.track-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.doc-list{display:flex;flex-direction:column}
.doc-row{display:grid;grid-template-columns:220px 1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){}
.doc-name{font-size:13px;font-weight:600;color:var(--blue)}
.doc-url{padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;background:#FBFDFE;font-family:var(--mono);font-size:12px}
.doc-url:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.18)}
.btn-dead{opacity:.45;cursor:default;pointer-events:none}

/* ---------- logo ---------- */
.brand-logo{width:auto;padding:6px 12px}
.brand-img{height:38px;display:block}

/* ---------- fiscal year ---------- */
.fy-badge{display:inline-block;margin-left:10px;background:var(--gold);color:var(--blue);font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;vertical-align:1px}
.fy-badge-next{background:#fff;color:var(--blue);margin-left:4px}
.fy-arrow{margin-left:4px;color:var(--sky-lt)}
.sched-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.fy-split{display:grid;grid-template-columns:auto auto 1fr;gap:12px;margin-top:14px;align-items:stretch}
@media(max-width:700px){.fy-split{grid-template-columns:1fr}}
.fy-cell{background:#F7FBFE;border:1.5px solid var(--line);border-radius:10px;padding:11px 16px;min-width:130px}
.fy-cell-next{border-color:var(--gold);background:#FFFBEE}
.fy-cell-tag{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--blue);letter-spacing:.06em}
.fy-cell-n{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px}
.fy-cell-sub{font-size:11px;color:var(--dim)}
.fy-cell-note{font-size:12.5px;color:var(--ink);background:none;border:none;display:flex;flex-direction:column;justify-content:center}
.fy-warn{color:var(--red);font-weight:600;margin-top:5px}
.fy-chip{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.05em;background:#EAF1F7;color:var(--blue);border-radius:999px;padding:2px 8px}
.fy-chip-cross{background:var(--gold);color:var(--blue)}

/* ---------- calendar strip ---------- */
.calstrip-wrap{overflow-x:auto;padding:24px 0 6px}
.calstrip{position:relative;display:flex;height:58px;min-width:420px;border-radius:9px;overflow:visible}
.cal-month{border:1px solid var(--line);border-right:none;background:#FBFDFE;position:relative}
.cal-month:last-child{border-right:1px solid var(--line)}
.cal-month:first-child{border-radius:9px 0 0 9px}
.cal-month:last-child{border-radius:0 9px 9px 0}
.cal-month-lbl{position:absolute;top:4px;left:7px;font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
.cal-span{position:absolute;top:24px;height:22px;background:linear-gradient(90deg,var(--sky),var(--blue-2));border-radius:6px;animation:riseIn .7s ease both;box-shadow:0 2px 6px rgba(14,78,140,.3)}
.cal-slip{position:absolute;top:24px;height:22px;background:repeating-linear-gradient(45deg,#8E1616 0 7px,#C62828 7px 14px);border-radius:0 6px 6px 0}
.cal-fyline{position:absolute;top:-12px;bottom:-4px;width:0;border-left:2.5px dashed var(--gold);z-index:2}
.cal-fyline-lbl{position:absolute;top:-9px;left:6px;white-space:nowrap;font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.06em;color:#946A00;background:#FFF6DE;border:1px solid #F0D492;border-radius:999px;padding:1px 8px}
.cal-marker{position:absolute;bottom:-14px;transform:translateX(-50%);font-size:10px;color:var(--blue)}

/* ===== CLOUD SHELL ===== */
.cloud-splash{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5A6B7C;background:#F2F6FA;font-size:15px}
.cloud-auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 90% 60% at 15% 0%,rgba(46,155,214,.16),transparent 60%),linear-gradient(165deg,#071A33,#0B2B4F)}
.cloud-auth-card{background:#fff;border-radius:18px;padding:34px 32px;width:100%;max-width:410px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.cloud-auth-logo{height:44px;display:block;margin-bottom:16px}
.cloud-auth-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#2E9BD6;text-transform:uppercase}
.cloud-auth-h1{margin:5px 0 22px;font-size:24px;color:#0B3D6E;font-weight:800}
.cloud-f{display:block;margin-bottom:13px}
.cloud-f>span{display:block;font-size:11px;font-weight:700;color:#5A6B7C;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.cloud-f input{width:100%;padding:10px 12px;border:1px solid #DCE6F0;border-radius:9px;font-size:15px;font-family:inherit;color:#16232F;background:#fff;box-sizing:border-box}
.cloud-f input:focus{outline:none;border-color:#2E9BD6;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.cloud-btn{padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;border:none;transition:filter .15s,transform .15s,box-shadow .15s}
.cloud-btn:hover{filter:brightness(.96);transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.cloud-btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.cloud-btn:disabled{opacity:.5;cursor:not-allowed}
.cloud-btn-primary{background:#0B3D6E;color:#fff;width:100%;margin-top:6px}
.cloud-btn-gold{background:#F2A900;color:#071A33}
.cloud-btn-ghost{background:#fff;color:#0B3D6E;border:1px solid #DCE6F0}
.cloud-msg{margin-top:13px;font-size:13.5px;color:#C62828}
.cloud-msg.ok{color:#2E7D52;background:#EEF8F1;border:1px solid #B9E3C6;border-radius:9px;padding:10px 12px}
.cloud-alt{margin-top:17px;font-size:14px;color:#5A6B7C}
.cloud-alt a{color:#2E9BD6;cursor:pointer;font-weight:700}
.cloud-forgot{display:block;text-align:right;margin:-5px 0 14px;color:#2E789F;font-size:13px;font-weight:700;cursor:pointer}
.cloud-auth-help{margin:-10px 0 18px;color:#657A8D;font-size:14px;line-height:1.5}
.cloud-shell{min-height:100vh;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 20% -10%,#164B7D 0%,transparent 55%),
             radial-gradient(ellipse 100% 70% at 85% 110%,#0A2C4E 0%,transparent 60%),
             linear-gradient(165deg,#071A33 0%,#0B3D6E 55%,#08284A 100%)}

/* drifting clouds */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cl{position:absolute;display:block;background:#fff;border-radius:100px;opacity:.14;
  filter:blur(10px);will-change:transform}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:100px}
.cl::before{width:52%;height:150%;top:-58%;left:16%}
.cl::after{width:38%;height:118%;top:-40%;right:16%}
.cl1{width:340px;height:74px;top:13%;animation:cloudSkyDrift 96s linear infinite}
.cl2{width:230px;height:52px;top:32%;opacity:.10;animation:cloudSkyDrift 128s linear infinite;animation-delay:-30s}
.cl3{width:430px;height:90px;top:55%;opacity:.12;animation:cloudSkyDrift 112s linear infinite;animation-delay:-58s}
.cl4{width:200px;height:46px;top:73%;opacity:.09;animation:cloudSkyDrift 146s linear infinite;animation-delay:-14s}
.cl5{width:300px;height:64px;top:87%;opacity:.08;animation:cloudSkyDrift 120s linear infinite;animation-delay:-76s}
@keyframes cloudSkyDrift{from{transform:translateX(-40vw)}to{transform:translateX(115vw)}}

/* portfolio content sits above the sky */
.cloud-hdr,.cloud-main{position:relative;z-index:1}
.cloud-hdr{background:rgba(7,26,51,.42);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:15px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;animation:cloudHeaderIn .5s cubic-bezier(.2,.8,.3,1) both}
.cloud-hdr-left{display:flex;align-items:center;gap:14px}
.cloud-hdr-logo{height:44px;border-radius:7px;display:block}
.cloud-hdr-eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#BFE3F5;font-weight:700}
.cloud-hdr-title{font-size:19px;font-weight:800;letter-spacing:.02em}
.cloud-hdr-right{display:flex;align-items:center;gap:12px;font-size:14px}
.cloud-user{opacity:.9}
.cloud-role{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.cloud-role-ed{background:#F2A900;color:#071A33}
.cloud-signout{cursor:pointer;opacity:.85;font-weight:600;color:#fff}
.cloud-signout:hover{opacity:1}
.cloud-main{max-width:1180px;margin:0 auto;padding:26px 26px 70px}
.cloud-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.cloud-bar-actions{display:flex;gap:10px;animation:cloudToolsIn .5s ease .16s both}
.cloud-h2{margin:0;font-size:27px;color:#fff;font-weight:800;letter-spacing:.01em;animation:cloudTitleIn .55s cubic-bezier(.2,.8,.3,1) .08s both}
.cloud-project-tabs{display:flex;gap:6px;margin:-4px 0 18px;padding:5px;width:max-content;max-width:100%;
  border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(7,26,51,.28)}
.cloud-project-tab{border:0;border-radius:8px;padding:9px 14px;background:transparent;color:#BDD3E5;
  font:700 13px/1 inherit;cursor:pointer;white-space:nowrap;transition:background .16s,color .16s,transform .16s,box-shadow .16s}
.cloud-project-tab.on{background:#fff;color:#0B3D6E;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.cloud-project-tab b{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:6px;padding:0 5px;
  border-radius:999px;background:rgba(46,155,214,.14);font-size:11px}
.cloud-project-tab:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.cloud-project-tab.on:hover{background:#fff}
.cloud-project-tab.on b{animation:cloudCountPop .35s cubic-bezier(.2,.8,.3,1) both}
.cloud-type{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(159,192,220,.35);
  border-radius:999px;padding:4px 9px;background:rgba(7,26,51,.18);color:#CFE0EC;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase}
button.cloud-type{cursor:pointer;font-family:inherit}
button.cloud-type:hover{background:rgba(46,155,214,.22);border-color:#6DB5DE}
.cloud-sub{color:#9FC0DC;font-size:14px;margin-top:4px}
.cloud-file{position:relative;overflow:hidden;display:inline-block}
.cloud-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cloud-empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.22);border-radius:14px;padding:44px;text-align:center;color:#9FC0DC}
.cloud-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.cloud-card{position:relative;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-top:3px solid #2E9BD6;border-radius:14px;padding:20px;cursor:pointer;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:box-shadow .16s,transform .16s,background .16s;animation:cloudCardIn .48s cubic-bezier(.2,.8,.3,1) both}
.cloud-card::after{content:"";position:absolute;inset:0;width:42%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.09),transparent);transform:translateX(-170%) skewX(-12deg);pointer-events:none}
.cloud-card:hover::after{animation:cloudCardSweep .8s ease both}
.cloud-card:nth-child(2){animation-delay:.06s}.cloud-card:nth-child(3){animation-delay:.12s}.cloud-card:nth-child(4){animation-delay:.18s}.cloud-card:nth-child(n+5){animation-delay:.24s}
.cloud-card:hover{background:rgba(255,255,255,.11);box-shadow:0 14px 36px rgba(0,0,0,.32);transform:translateY(-2px)}
.cloud-card-stop{border-top-color:#FF6B61}
.cloud-card-top{display:flex;justify-content:space-between;gap:11px;align-items:flex-start;margin-bottom:5px}
.cloud-card-title{font-weight:800;font-size:17px;color:#fff;line-height:1.28;flex:1}
.cloud-card-title::after{content:"  ›";display:inline-block;color:#69BDEA;opacity:.55;transform:translateX(0);transition:transform .18s,opacity .18s}
.cloud-card:hover .cloud-card-title::after{opacity:1;transform:translateX(4px)}
.cloud-card-sub{font-size:13px;color:#8FB0CC;margin-bottom:14px}
.cloud-pill{flex-shrink:0;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;animation:cloudStatusBreathe 4s ease-in-out 1s infinite}
.cloud-pill-green{background:#E4F2EA;color:#2E7D52}
.cloud-pill-amber{background:#FBF0DC;color:#B7791F}
.cloud-pill-red{background:#FBE9E9;color:#C62828}
.cloud-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cloud-card-stats i{display:block;font-style:normal;font-size:10.5px;color:#7E9DB8;text-transform:uppercase;letter-spacing:.06em}
.cloud-card-stats b{display:block;font-size:16px;color:#fff;margin-top:2px;transition:transform .18s,color .18s}
.cloud-card:hover .cloud-card-stats b{transform:translateY(-1px);color:#D9F2FF}
@keyframes cloudCardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cloudStatusBreathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.08)}}
@keyframes cloudCountPop{0%{transform:scale(.7);opacity:.25}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes cloudHeaderIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes cloudTitleIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes cloudToolsIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes cloudCardSweep{from{transform:translateX(-170%) skewX(-12deg)}to{transform:translateX(340%) skewX(-12deg)}}
@keyframes cloudModalIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cloudStatusIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes munisIconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes munisDotPulse{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 7px transparent}}
.cloud-bad{color:#FF8A82}
.cloud-modal-bg{position:fixed;inset:0;background:rgba(7,26,51,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9000;animation:fadeIn .2s ease both}
.cloud-modal{position:relative;background:#fff;border-radius:16px;padding:26px;width:100%;max-width:660px;max-height:90vh;overflow:auto;animation:cloudModalIn .34s cubic-bezier(.2,.8,.3,1) both}
.cloud-modal-h{margin:0 0 18px;font-size:21px;color:#0B3D6E;font-weight:800}
.cloud-modal-close{position:sticky;top:0;float:right;z-index:2;width:34px;height:34px;margin:-8px -8px 0 10px;border:1px solid #D7E4EE;border-radius:50%;background:#fff;color:#486174;font:800 18px/1 inherit;cursor:pointer;box-shadow:0 4px 12px rgba(7,26,51,.12)}
.cloud-f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.cloud-f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.cloud-fh{font-size:11px;font-weight:800;color:#5A6B7C;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 11px}
.cloud-modal-actions{display:flex;gap:10px;margin-top:20px}
.munis-demo-note{margin:0 0 16px;padding:12px 14px;border:1px solid #F0D28A;border-radius:10px;background:#FFF8E5;color:#72520A;font-size:13px;line-height:1.45}

.munis-status-head>div{display:flex;align-items:center;gap:9px;min-width:0}.munis-status-head b{font-family:var(--disp);font-size:15px;letter-spacing:.05em;text-transform:uppercase}

/* ===== AI ASSISTANT (Beta 3) ===== */
@keyframes aiFabIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes aiPanelIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes aiMsgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aiSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes aiShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes aiDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes aiCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes aiPulse{0%,100%{box-shadow:0 8px 26px rgba(11,61,110,.4),0 0 0 0 rgba(46,155,214,.45)}50%{box-shadow:0 8px 26px rgba(11,61,110,.4),0 0 0 10px rgba(46,155,214,0)}}
@keyframes aiStarSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}

.ai-fab{position:fixed;right:20px;bottom:20px;z-index:8000;
  background:linear-gradient(120deg,#0B3D6E,#2E9BD6,#6FC5F0,#2E9BD6,#0B3D6E);
  background-size:200% 100%;animation:aiFabIn .4s cubic-bezier(.2,.8,.3,1) both,aiSweep 6s linear infinite,aiPulse 3.2s ease-in-out infinite 1s;
  color:#fff;border:none;border-radius:999px;padding:12px 19px;font-weight:600;font-size:14.5px;font-family:inherit;
  letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform .15s}
.ai-fab:hover{transform:translateY(-2px)}
.ai-fab:hover .ai-fab-star{animation:aiStarSpin .7s ease}
.ai-fab-star{color:#F2A900;font-size:15px;display:inline-block}
.ai-panel{position:fixed;right:22px;bottom:22px;z-index:8000;width:min(450px,calc(100vw - 32px));
  height:min(600px,calc(100vh - 60px));background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(7,26,51,.42);
  display:flex;flex-direction:column;overflow:hidden;border:1px solid #DCE6F0;
  animation:aiPanelIn .34s cubic-bezier(.2,.8,.3,1) both}
.ai-head{position:relative;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(120deg,#071A33,#0B3D6E,#2E9BD6,#0B3D6E,#071A33);background-size:200% 100%;animation:aiSweep 8s linear infinite}
.ai-head-title{font-weight:600;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.ai-head .ai-fab-star{animation:aiStarSpin 4s ease-in-out infinite}
.ai-close{cursor:pointer;font-size:26px;line-height:1;opacity:.8;color:#fff}
.ai-close:hover{opacity:1}
.ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#F7FAFD}
.ai-intro{color:#5A6B7C;font-size:14px;line-height:1.6;animation:aiMsgIn .4s ease both}
.ai-intro p{margin:0 0 12px;line-height:1.5}
.ai-suggest{display:flex;flex-direction:column;gap:8px}
.ai-chip{text-align:left;background:#fff;border:1px solid #DDE7F1;border-radius:10px;padding:10px 13px;
  font-size:14px;color:#39506B;font-family:inherit;cursor:pointer;font-weight:500;line-height:1.4;transition:background .12s,border-color .12s,transform .12s}
.ai-chip:hover{background:#EAF3FB;border-color:#2E9BD6;transform:translateX(3px)}
.ai-msg-row{display:flex;animation:aiMsgIn .32s cubic-bezier(.2,.8,.3,1) both}
.ai-msg{max-width:88%;padding:11px 14px;border-radius:12px;font-size:15px;line-height:1.62;white-space:pre-wrap;word-wrap:break-word;font-weight:400;letter-spacing:.005em}
.ai-user{margin-left:auto;background:#0B3D6E;color:#fff;border-bottom-right-radius:4px}
.ai-ai{background:#fff;color:#16232F;border:1px solid #E1EAF3;border-bottom-left-radius:4px}
.ai-err{background:#FBE9E9;color:#C62828;border:1px solid #F3C9C9;border-radius:11px}
.ai-thinking{display:inline-flex;align-items:center;gap:9px;animation:aiMsgIn .3s ease both}
.ai-shimmer{font-weight:600;background:linear-gradient(90deg,#8296A8 0%,#2E9BD6 25%,#6FC5F0 50%,#2E9BD6 75%,#8296A8 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:aiShimmer 1.6s linear infinite}
.ai-dots{display:inline-flex;gap:4px}
.ai-dots i{width:6px;height:6px;border-radius:50%;background:#2E9BD6;display:inline-block;animation:aiDot 1.3s ease-in-out infinite}
.ai-dots i:nth-child(2){animation-delay:.18s}
.ai-dots i:nth-child(3){animation-delay:.36s}
.ai-caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:text-bottom;
  background:linear-gradient(#2E9BD6,#6FC5F0);border-radius:2px;animation:aiCaret .9s step-end infinite}
.ai-input{display:flex;gap:8px;padding:12px;border-top:1px solid #E7EEF5;background:#fff}
.ai-input input{flex:1;padding:11px 13px;border:1px solid #DCE6F0;border-radius:9px;font-size:14.5px;font-family:inherit;color:#16232F;transition:border-color .15s,box-shadow .15s}
.ai-input input:focus{outline:none;border-color:#2E9BD6;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.ai-input button{background:#0B3D6E;color:#fff;border:none;border-radius:9px;padding:11px 17px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;transition:filter .15s}
.ai-input button:hover:not(:disabled){filter:brightness(1.1)}
.ai-input button:disabled{opacity:.45;cursor:not-allowed}
.ai-foot{padding:8px 14px 12px;font-size:11.5px;color:#93A6B7;text-align:center;background:#fff}

.ai-modes{display:flex;gap:6px;padding:10px 12px;background:#EEF4FA;border-bottom:1px solid #E1EAF3;overflow-x:auto}
.ai-mode{flex:none;background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 12px;
  font-size:12.5px;font-weight:500;color:#5A6B7C;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.ai-mode:hover{background:#fff;color:#0B3D6E}
.ai-mode.on{background:#0B3D6E;color:#fff;border-color:#0B3D6E}
.ai-note{font-size:12px;color:#8296A8;font-style:italic;margin-top:8px}
.ai-input-tall{flex-direction:column;align-items:stretch;gap:8px}
.ai-input-tall textarea{width:100%;padding:10px 12px;border:1px solid #DCE6F0;border-radius:9px;
  font-size:13.5px;font-family:inherit;color:#16232F;resize:vertical;min-height:74px;box-sizing:border-box}
.ai-input-tall textarea:focus{outline:none;border-color:#2E9BD6;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.ai-input-tall button{align-self:flex-end}

/* ===== LEARN MODE ===== */
.learn-layer{position:fixed;inset:0;z-index:9500;pointer-events:none}
.learn-dim{position:absolute;inset:0;background:rgba(7,26,51,.55);pointer-events:auto;animation:aiMsgIn .25s ease both}

  box-shadow:0 0 0 9999px rgba(7,26,51,.55),0 0 22px rgba(242,169,0,.75);transition:all .35s cubic-bezier(.2,.8,.3,1)}
.learn-card{position:absolute;width:min(384px,calc(100vw - 32px));background:#fff;border-radius:15px;
  padding:18px 20px;box-shadow:0 20px 56px rgba(7,26,51,.5);pointer-events:auto;
  animation:aiPanelIn .3s cubic-bezier(.2,.8,.3,1) both;z-index:2}
.learn-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.learn-count{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#2E9BD6}
.learn-x{cursor:pointer;font-size:22px;line-height:1;color:#8296A8}
.learn-x:hover{color:#16232F}
.learn-card h3{margin:0 0 7px;font-size:17px;color:#0B3D6E;font-weight:800}
.learn-card p{margin:0;font-size:14px;line-height:1.55;color:#44586B}
.learn-wait{margin-top:11px;font-size:12.5px;color:#B7791F;display:flex;align-items:center;gap:7px;font-weight:600}
.learn-pulse{width:8px;height:8px;border-radius:50%;background:#F2A900;animation:aiDot 1.2s ease-in-out infinite}
.learn-bar{height:4px;background:#E7EEF5;border-radius:999px;margin:14px 0 12px;overflow:hidden}
.learn-fill{height:100%;background:linear-gradient(90deg,#2E9BD6,#F2A900);border-radius:999px;transition:width .35s ease}
.learn-actions{display:flex;justify-content:space-between;gap:9px}

/* ===== AI PROPOSED CHANGE ===== */
.ai-propose{background:#FFF9EC;border:1.5px solid #F2A900;border-radius:13px;padding:14px;animation:aiMsgIn .3s ease both}
.ai-propose-h{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9A6C00;margin-bottom:7px}
.ai-propose-sum{font-size:14.5px;color:#16232F;line-height:1.55;margin-bottom:9px;font-weight:600}
.ai-propose-list{margin:0 0 9px;padding-left:18px;font-size:13.5px;color:#44586B;line-height:1.65}
.ai-propose-warn{background:#FBE9E9;color:#C62828;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.ai-propose-actions{display:flex;gap:8px}
.ai-apply{background:#0B3D6E;color:#fff;border:none;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer}
.ai-apply:hover{filter:brightness(1.12)}
.ai-cancel{background:#fff;color:#5A6B7C;border:1px solid #DCE6F0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer}
.btn-learn{background:rgba(242,169,0,.22)!important;border-color:rgba(242,169,0,.5)!important}

/* ===== DISPLAY MODE — office wall board ===== */
.cloud-clock{font-variant-numeric:tabular-nums;opacity:.9;font-weight:600}
.cloud-display{background:#061627}
.cloud-display .cloud-hdr{padding:20px 34px}
.cloud-display .cloud-hdr-title{font-size:27px}
.cloud-display .cloud-hdr-eyebrow{font-size:12.5px}
.cloud-display .cloud-hdr-logo{height:48px}
.cloud-display .cloud-hdr-right{font-size:18px}
.cloud-display .cloud-main{max-width:1800px;padding:26px 34px 40px}
.cloud-display .cloud-h2{font-size:34px;color:#fff}
.cloud-display .cloud-sub{font-size:16px;color:#8FB0CC}
.cloud-display .cloud-grid{grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px}
.cloud-display .cloud-card{cursor:default;background:#0E2740;border-color:#1B3D5E;border-top-width:5px;padding:24px}
.cloud-display .cloud-card:hover{transform:none;box-shadow:none}
.cloud-display .cloud-card-title{color:#fff;font-size:22px}
.cloud-display .cloud-card-sub{color:#8FB0CC;font-size:15px}
.cloud-display .cloud-card-stats i{font-size:12.5px;color:#7E9DB8}
.cloud-display .cloud-card-stats b{font-size:26px;color:#fff}
.cloud-display .cloud-bad{color:#FF8A82}
.cloud-display .cloud-pill{font-size:13px;padding:6px 15px}
.cloud-display .cloud-card{background:linear-gradient(145deg,#102C47,#0B2137);box-shadow:0 14px 32px rgba(0,0,0,.18)}
.cloud-display .cloud-card::after{display:none}
.cloud-display .cloud-card-top{padding-bottom:11px;border-bottom:1px solid rgba(126,157,184,.18)}
.cloud-display .cloud-type{margin:2px 0 18px;background:rgba(46,155,214,.12);border-color:rgba(105,189,234,.32)}
.wall-card-progress{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:19px;padding-top:17px;border-top:1px solid rgba(126,157,184,.18)}
.wall-card-meter-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;color:#89A9C0;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.wall-card-meter-label b{color:#D8EAF5;font-size:12px}
.wall-card-meter-track{height:9px;overflow:hidden;border-radius:999px;background:#061827;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.wall-card-meter-fill{height:100%;border-radius:999px;animation:wallBarGrow .8s cubic-bezier(.2,.8,.3,1) both}
.wall-card-meter-fill.budget{background:linear-gradient(90deg,#2E9BD6,#73D5F5)}
.wall-card-meter-fill.schedule{background:linear-gradient(90deg,#56C78A,#9BE3B9)}
.wall-card-meter-fill.schedule.risk{background:linear-gradient(90deg,#F2A900,#FF6B61)}
.wall-rollup{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:24px}
.wall-stat{background:#0E2740;border:1px solid #1B3D5E;border-radius:14px;padding:18px 20px;text-align:center;animation:wallStatIn .45s cubic-bezier(.2,.8,.3,1) both;transition:transform .2s,border-color .2s,box-shadow .2s}
.wall-stat:nth-child(2){animation-delay:.05s}.wall-stat:nth-child(3){animation-delay:.1s}.wall-stat:nth-child(4){animation-delay:.15s}.wall-stat:nth-child(5){animation-delay:.2s}.wall-stat:nth-child(6){animation-delay:.25s}
.wall-stat:hover{transform:translateY(-3px);border-color:#2E9BD6;box-shadow:0 10px 25px rgba(0,0,0,.22)}
.wall-stat b{display:block;font-size:38px;font-weight:800;color:#fff;line-height:1.05}
.wall-stat i{display:block;font-style:normal;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:#7E9DB8;margin-top:6px}
@keyframes wallStatIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.wall-ok b{color:#7BD6A2}
.wall-watch b{color:#F2C368}
.wall-stop b{color:#FF8A82}
.wall-gold b{color:#F2A900}
.wall-visuals{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:16px;margin-bottom:24px}
.wall-chart{min-height:245px;padding:20px;border:1px solid #1B3D5E;border-radius:14px;background:linear-gradient(145deg,#0E2740,#0A2035);box-shadow:0 12px 28px rgba(0,0,0,.15);animation:wallStatIn .5s cubic-bezier(.2,.8,.3,1) both}
.wall-chart:nth-child(2){animation-delay:.08s}.wall-chart:nth-child(3){animation-delay:.16s}
.wall-chart-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.wall-chart-head span{display:block;color:#7E9DB8;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.wall-chart-head b{display:block;margin-top:4px;color:#E9F4FB;font-size:14px}
.wall-health-body{display:flex;align-items:center;justify-content:center;gap:25px;min-height:172px}
.wall-donut{width:130px;height:130px;flex:none;border-radius:50%;padding:14px;box-sizing:border-box;animation:wallDonutIn .8s cubic-bezier(.2,.8,.3,1) .2s both}
.wall-donut>div{width:100%;height:100%;display:grid;place-items:center;align-content:center;border-radius:50%;background:#0B2137;box-shadow:inset 0 0 0 1px #1B3D5E}
.wall-donut b{color:#fff;font-size:30px;line-height:1}.wall-donut span{margin-top:4px;color:#7E9DB8;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wall-legend{min-width:105px}.wall-legend>div{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:7px;padding:6px 0;color:#B9CEDD;font-size:11.5px}
.wall-legend i{width:8px;height:8px;border-radius:50%}.wall-legend i.good{background:#56C78A}.wall-legend i.watch{background:#F2A900}.wall-legend i.stop{background:#FF6B61}.wall-legend b{color:#fff}
.wall-bars{display:flex;flex-direction:column;gap:12px}.wall-bar-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px;color:#AFC6D8;font-size:10.5px}.wall-bar-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wall-bar-label b{flex:none;color:#EAF5FB;font-size:10.5px}
.wall-bar-track{height:8px;overflow:hidden;border-radius:999px;background:#071A2C}.wall-bar-fill{height:100%;border-radius:999px;transform-origin:left;animation:wallBarGrow .8s cubic-bezier(.2,.8,.3,1) both}.wall-bar-fill.budget{background:linear-gradient(90deg,#2E9BD6,#74D4F4)}.wall-bar-fill.exposure{background:linear-gradient(90deg,#F2A900,#FFD778)}
@keyframes wallDonutIn{from{opacity:0;transform:rotate(-80deg) scale(.75)}to{opacity:1;transform:none}}
@keyframes wallBarGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:1400px){.wall-rollup{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1200px){.wall-visuals{grid-template-columns:1fr 1fr}.wall-health-chart{grid-column:1/-1}}
@media(max-width:760px){.wall-rollup{grid-template-columns:repeat(2,1fr)}.wall-visuals{grid-template-columns:1fr}.wall-health-chart{grid-column:auto}}

/* On phones, decorative layers must never cover project controls. */
@media(max-width:950px){
  .cloud-card::after{display:none!important}
  .hdr::after,.hdr-sky{display:none!important}
  .ai-fab{right:12px;bottom:12px;width:46px;height:46px;padding:0;justify-content:center;font-size:0}
  .ai-fab-star{font-size:18px}
  .ai-panel{inset:10px;width:auto;height:auto;border-radius:14px}
  .learn-layer{pointer-events:none!important}
  .learn-dim,.learn-ring{display:none!important;pointer-events:none!important}
  .learn-card{position:fixed!important;left:12px!important;right:12px!important;bottom:12px!important;top:auto!important;width:auto!important;max-height:44vh;overflow:auto;transform:none!important;pointer-events:auto!important}
}

.ai-attached{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#EEF4FA;border-top:1px solid #E1EAF3;font-size:12px;color:#3F566B}
.ai-attached-load{color:#8296A8;font-style:italic}
.ai-clip{color:#2E9BD6;font-size:13px}
.ai-attached-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ai-attached-x{cursor:pointer;color:#8296A8;font-size:17px;line-height:1}
.ai-attached-x:hover{color:#C62828}
.ai-attach{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:5px;
  cursor:pointer;color:#66788A;font-size:15px;padding:0 7px;border-radius:8px;transition:color .12s,background .12s}
.ai-attach:hover{color:#0B3D6E;background:#EEF4FA}
.ai-attach input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ai-input-tall .ai-attach{font-size:12px;padding:7px 10px;border:1px solid #DCE6F0;background:#fff}
.ai-tall-row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ===== NEW PROJECT — CHARTER EXTRACTION ===== */
.np-charter{background:#F4F8FC;border:1px solid #DCE6F0;border-radius:12px;padding:14px;margin-bottom:18px}
.np-charter-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.np-charter-txt b{display:block;font-size:13.5px;color:#0B3D6E;margin-bottom:3px}
.np-charter-txt span{display:block;font-size:12px;color:#66788A;line-height:1.5;max-width:44ch}
.np-charter-btns{display:flex;gap:8px;flex:none}
.np-charter-btns .cloud-btn{font-size:12.5px;padding:8px 13px}
.np-busy{opacity:.6;pointer-events:none}
.np-paste{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.np-paste textarea{width:100%;padding:10px 12px;border:1px solid #DCE6F0;border-radius:9px;
  font-size:12.5px;font-family:inherit;color:#16232F;resize:vertical;box-sizing:border-box;line-height:1.5}
.np-paste textarea:focus{outline:none;border-color:#2E9BD6;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.np-paste .cloud-btn{align-self:flex-end;font-size:12.5px;padding:8px 15px}
.np-extracted{margin-top:12px;background:#FFF9EC;border:1px solid #F2A900;border-radius:10px;padding:11px 13px}
.np-extracted-h{font-size:12.5px;font-weight:700;color:#9A6C00;margin-bottom:6px}
.np-notes{margin:0 0 7px;padding-left:17px;font-size:12px;color:#5A6B7C;line-height:1.6}
.np-legend{font-size:11.5px;color:#8296A8;display:flex;align-items:center;gap:6px}
.np-dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:#F2A900}
.np-check>span::after{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;
  background:#F2A900;margin-left:6px;vertical-align:middle}
.np-check input,.np-check select{border-color:#F2A900!important;background:#FFFDF7}

.grant-sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.grant-sec-name{flex:1;font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:16px;
  font-weight:700;color:var(--blue);background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 8px}
.grant-sec-name:hover{border-color:var(--line);background:#fff}
.grant-sec-name:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.grant-add{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.grant-add>span{font-size:13px;font-weight:600;color:var(--dim)}
.grant-add-btns{display:flex;gap:8px;flex-wrap:wrap}

.sky-hdr{z-index:0}
.sky-hdr .cl{opacity:.13;filter:blur(8px)}
.hdr>.hdr-inner,.hdr>.hdr-sky{position:relative;z-index:1}
.grant-meta{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.grant-meta label{display:block}
.grant-meta label>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.grant-meta input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;min-width:190px}
.grant-meta input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.grant-pop-warn{font-size:12px;font-weight:600;color:#B7791F;background:#FBF0DC;border-radius:7px;padding:6px 10px}
.sched-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:12px}
.sched-f>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.sched-f input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;box-sizing:border-box}
.sched-f input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.sched-wide{display:block;margin-top:4px}
.sched-slip{padding:8px 11px;border-radius:8px;background:#EEF4FA;font-size:13.5px;font-weight:600;color:var(--ink)}
.slip-bad{background:#FBE9E9;color:#C62828}
.slip-good{background:#E4F2EA;color:#2E7D52}
.co-h{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:14px;font-weight:700;color:var(--blue);margin:18px 0 4px}
.co-table{margin:10px 0}
.co-row{display:grid;grid-template-columns:56px 1fr 120px 90px 90px 34px;gap:8px;align-items:center;padding:5px 0}
.co-head{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:7px}
.co-row input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;width:100%;box-sizing:border-box}
.co-row input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.co-pct{font-size:13px;color:var(--dim);text-align:center}
.co-total{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--blue)}
.doc-note{background:#FBF0DC;border:1px solid #F0D9A8;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#8A6414;margin:10px 0 14px;line-height:1.5}
.doc-group{margin-bottom:4px}
.doc-add-row{padding-left:calc(34% + 8px);margin:2px 0 8px}
@media(max-width:820px){.doc-row{grid-template-columns:150px 1fr auto auto;gap:8px}}
@media(max-width:760px){.co-row{grid-template-columns:1fr 1fr;}.co-head{display:none}}

/* ===== FIELD MODE — phone-first, big targets, no jargon ===== */
.field-app{min-height:100vh;background:#F2F6FA;display:flex;flex-direction:column}
.field-hdr{background:linear-gradient(120deg,#071A33,#0B3D6E);color:#fff;padding:16px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.field-logo{height:36px;background:#fff;border-radius:8px;padding:4px 6px}
.field-hdr-txt{flex:1;min-width:0}
.field-hdr-eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9FC0DC;font-weight:700}
.field-hdr-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-signout{color:#fff;opacity:.85;font-size:14px;font-weight:600;cursor:pointer;flex:none;padding:6px}
.field-main{padding:20px 16px 40px;max-width:560px;margin:0 auto;width:100%;box-sizing:border-box}
.field-h1{font-size:22px;color:#0B3D6E;font-weight:800;margin:4px 0 16px}
.field-loading,.field-empty{padding:30px;text-align:center;color:#7C8FA1;font-size:15px}
.field-proj-list{display:flex;flex-direction:column;gap:10px}
.field-proj-btn{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:#fff;border:1px solid #DCE6F0;border-radius:14px;padding:18px 20px;
  font-size:17px;font-weight:700;color:#0B3D6E;font-family:inherit;text-align:left;cursor:pointer;
  min-height:64px;box-shadow:0 1px 3px rgba(11,61,110,.06)}
.field-proj-btn:active{background:#EAF3FB}
.field-chev{color:#9FB4C6;font-size:24px}

.field-proj{max-width:560px;margin:0 auto;width:100%;padding-bottom:40px}
.field-proj-hdr{padding:16px 16px 8px}
.field-back{color:#2E9BD6;font-weight:700;font-size:15px;cursor:pointer;display:inline-block;margin-bottom:6px}
.field-proj-title{font-size:20px;font-weight:800;color:#0B3D6E;line-height:1.25}
.field-tabs{display:flex;gap:8px;padding:8px 16px;position:sticky;top:68px;background:#F2F6FA;z-index:5}
.field-tab{flex:1;padding:12px;border-radius:11px;border:1px solid #DCE6F0;background:#fff;
  font-size:15px;font-weight:700;color:#5A6B7C;font-family:inherit;cursor:pointer;min-height:48px}
.field-tab.on{background:#0B3D6E;color:#fff;border-color:#0B3D6E}
.field-body{padding:10px 16px 20px}

.field-progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.field-progress-bar{flex:1;height:10px;background:#E1EAF3;border-radius:999px;overflow:hidden}
.field-progress-bar>div{height:100%;background:linear-gradient(90deg,#2E9BD6,#F2A900);border-radius:999px;transition:width .3s}
.field-progress span{font-size:14px;font-weight:700;color:#0B3D6E;white-space:nowrap}

.field-check{display:flex;align-items:center;gap:14px;width:100%;background:#fff;
  border:1px solid #DCE6F0;border-radius:13px;padding:16px 18px;margin-bottom:9px;
  font-family:inherit;text-align:left;cursor:pointer;min-height:60px;transition:background .12s,border-color .12s}
.field-check.done{background:#EEF8F1;border-color:#B9E3C6}
.field-check-box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #C9D9E8;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;
  background:#fff}
.field-check.done .field-check-box{background:#2E7D52;border-color:#2E7D52}
.field-check-label{font-size:16px;font-weight:600;color:#16232F;line-height:1.35}
.field-check.done .field-check-label{color:#3D6650;text-decoration:line-through;text-decoration-color:#9FCBB0}

.field-new-report{width:100%;background:#F2A900;color:#071A33;border:none;border-radius:13px;
  padding:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;margin-bottom:16px;min-height:56px}
.field-report{background:#fff;border:1px solid #DCE6F0;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.field-report-top{display:flex;justify-content:space-between;margin-bottom:6px}
.field-report-cat{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#0B3D6E;background:#EAF3FB;padding:3px 10px;border-radius:999px}
.field-report-date{font-size:12.5px;color:#8296A8}
.field-report-note{font-size:15px;color:#16232F;line-height:1.5}

.field-sheet-bg{position:fixed;inset:0;background:rgba(7,26,51,.55);z-index:9000;
  display:flex;align-items:flex-end}
.field-sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;margin:0 auto}
.field-sheet-h{font-size:18px;font-weight:800;color:#0B3D6E;margin-bottom:14px}
.field-cat-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.field-cat-btn{padding:9px 15px;border-radius:999px;border:1.5px solid #DCE6F0;background:#fff;
  font-size:14px;font-weight:700;color:#5A6B7C;font-family:inherit;cursor:pointer}
.field-cat-btn.on{background:#0B3D6E;color:#fff;border-color:#0B3D6E}
.field-textarea{width:100%;padding:14px;border:1px solid #DCE6F0;border-radius:12px;font-size:16px;
  font-family:inherit;color:#16232F;box-sizing:border-box;resize:vertical;margin-bottom:16px}

/* ===== FIELD POLISH =====
   The field view is used one-handed, outdoors, in sunlight, often with
   gloves. That drives every choice here: high contrast, large targets, and
   no decoration that costs legibility. */

/* Header gets the same sky treatment as the rest of the app rather than a
   flat navy bar — it was the one screen that looked unfinished. */
.field-hdr{background:linear-gradient(120deg,#071A33,#0B3D6E 55%,#164B7D);
  box-shadow:0 2px 14px rgba(7,26,51,.28);position:sticky;top:0;z-index:10}
.field-hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#2E9BD6,#F2A900)}

.field-app{background:linear-gradient(180deg,#EDF3F9 0%,#F5F8FB 320px)}
.field-h1{font-size:24px;letter-spacing:-.01em}

/* Project cards: give them a left accent and lift so they read as tappable
   objects rather than list rows. */
.field-proj-btn{border-left:4px solid #2E9BD6;box-shadow:0 2px 8px rgba(11,61,110,.08);
  transition:transform .12s,box-shadow .12s}
.field-proj-btn:active{transform:scale(.985);box-shadow:0 1px 4px rgba(11,61,110,.12)}

/* Checklist: the tick is the whole interaction, so make it unmistakable. */
.field-check{box-shadow:0 1px 4px rgba(11,61,110,.06);transition:transform .1s,background .15s}
.field-check:active{transform:scale(.99)}
.field-check.done{background:linear-gradient(90deg,#EEF8F1,#F6FBF8);border-color:#B9E3C6}
.field-check-box{transition:background .18s,border-color .18s,transform .18s}
.field-check.done .field-check-box{transform:scale(1.06)}

/* Progress bar reads at arm's length. */
.field-progress-bar{height:12px}
.field-progress span{font-size:15px}

/* Tabs sit on the tinted background, so give them presence. */
.field-tab{box-shadow:0 1px 3px rgba(11,61,110,.06)}
.field-tab.on{box-shadow:0 2px 8px rgba(11,61,110,.22)}

/* Reports read as cards with a colour-coded category, so a Safety note is
   distinguishable from routine progress at a glance. */
.field-report{border-left:4px solid #C9D9E8;box-shadow:0 1px 4px rgba(11,61,110,.06)}
.field-report-cat{letter-spacing:.07em}
.fr-Safety{border-left-color:#C62828}
.fr-Maintenance{border-left-color:#F2A900}
.fr-Progress{border-left-color:#2E7D52}
.fr-Other{border-left-color:#8296A8}
