//  CLOUD SHELL
//  Wraps the original JMAA tracker with: sign-in, a multi-project picker, and
//  the read/write bridge to Supabase. The tracker UI itself is unchanged.
// ============================================================================

const SUPABASE_URL = window.JMAA_CONFIG.supabaseUrl;
const SUPABASE_KEY = window.JMAA_CONFIG.supabaseAnonKey;
const CONFIGURED = SUPABASE_URL && !SUPABASE_URL.includes("YOUR_") && SUPABASE_KEY && !SUPABASE_KEY.includes("YOUR_");
// Capture recovery intent before the Supabase client exchanges the URL token
// and removes its hash. Without this, a valid email link can sign the user in
// but the app no longer knows to show the new-password form.
const RECOVERY_URL_SEEN = /(?:^|[?#&])type=recovery(?:&|$)/i.test(window.location.search + window.location.hash);
if (RECOVERY_URL_SEEN) sessionStorage.setItem("jan-cpt-password-recovery", "1");
let sb = null;
let BOOT_ERROR = "";
if (CONFIGURED) {
  try {
    if (!window.supabase || !window.supabase.createClient) {
      BOOT_ERROR = "The Supabase library didn't load. This usually means no internet " + "connection, or a network that blocks cdn.jsdelivr.net. Try another network, " + "or ask IT to allow unpkg.com and cdn.jsdelivr.net.";
    } else {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch (e) {
    BOOT_ERROR = "Could not connect to the database: " + (e.message || String(e)) + "  —  check that the URL and key in the config block are correct and still in quotes.";
  }
}

// ---------------------------------------------------------------------------
//  Cloud bridge — the tracker calls window.JMAA_CLOUD.saveProject() on change.
//  Everything is written back into the same shape the tracker already uses.
// ---------------------------------------------------------------------------
window.JMAA_CLOUD = {
  async saveProject(projectId, {
    actuals,
    grant,
    payApps,
    sched,
    meta
  }) {
    try {
      // 1. project row: meta, schedule, grant block
      const {
        error: pe
      } = await sb.from("projects").update({
        title: meta.title,
        meta,
        sched,
        grant_info: grant
      }).eq("id", projectId);
      if (pe) throw pe;

      // 2. weekly actuals — upsert every week present, delete any removed
      const weeks = Object.keys(actuals).map(k => parseInt(k, 10)).filter(n => n >= 1);
      if (weeks.length) {
        const rows = weeks.map(w => ({
          project_id: projectId,
          week_no: w,
          spend: Number(actuals[w].spend) || 0,
          days_lost: Number(actuals[w].daysLost) || 0,
          note: actuals[w].note || ""
        }));
        const {
          error: we
        } = await sb.from("weekly_actuals").upsert(rows, {
          onConflict: "project_id,week_no"
        });
        if (we) throw we;
      }
      await sb.from("weekly_actuals").delete().eq("project_id", projectId).not("week_no", "in", `(${weeks.length ? weeks.join(",") : "0"})`);

      // 3. pay applications — upsert present, delete removed
      const nums = payApps.map(p => Number(p.number)).filter(n => n);
      if (payApps.length) {
        const rows = payApps.map(p => ({
          project_id: projectId,
          number: Number(p.number),
          period_end: p.periodEnd || null,
          work_completed: Number(p.workCompleted) || 0,
          retainage_pct: Number(p.retainagePct) || 0,
          submitted: p.submitted || null,
          certified: p.certified || null,
          paid: p.paid || null,
          reimb_requested: p.reimbRequested || null,
          reimb_received: p.reimbReceived || null,
          reimb_amount: p.reimbAmount === "" || p.reimbAmount == null ? null : Number(p.reimbAmount)
        }));
        const {
          error: pae
        } = await sb.from("pay_apps").upsert(rows, {
          onConflict: "project_id,number"
        });
        if (pae) throw pae;
      }
      await sb.from("pay_apps").delete().eq("project_id", projectId).not("number", "in", `(${nums.length ? nums.join(",") : "0"})`);
      return {
        ok: true
      };
    } catch (e) {
      return {
        ok: false,
        error: e.message || String(e)
      };
    }
  }
};

// pull one project back out of the database in the tracker's own shape
async function loadProject(projectId) {
  const [{
    data: p
  }, {
    data: wk
  }, {
    data: pa
  }] = await Promise.all([sb.from("projects").select("*").eq("id", projectId).single(), sb.from("weekly_actuals").select("*").eq("project_id", projectId), sb.from("pay_apps").select("*").eq("project_id", projectId)]);
  const actuals = {};
  (wk || []).forEach(r => {
    actuals[r.week_no] = {
      spend: Number(r.spend),
      daysLost: Number(r.days_lost),
      note: r.note || ""
    };
  });
  const payApps = (pa || []).sort((a, b) => a.number - b.number).map(r => ({
    id: r.id,
    number: r.number,
    periodEnd: r.period_end || "",
    workCompleted: Number(r.work_completed),
    retainagePct: Number(r.retainage_pct),
    submitted: r.submitted || "",
    certified: r.certified || "",
    paid: r.paid || "",
    reimbRequested: r.reimb_requested || "",
    reimbReceived: r.reimb_received || "",
    reimbAmount: r.reimb_amount == null ? "" : Number(r.reimb_amount)
  }));
  return {
    meta: p.meta || {},
    sched: p.sched || {},
    grant: p.grant_info || {
      milestones: {},
      docs: {},
      coCount: 0,
      safetyIncidents: 0
    },
    actuals,
    payApps
  };
}

// ---------------------------------------------------------------------------
//  PROJECT PICKER
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
//  Shared portfolio math. Card status, the wall roll-up, and any future
//  reporting all read from here so the numbers can never disagree.
// ---------------------------------------------------------------------------
function summarize(p) {
  const meta = p.meta || {};
  const n = v => {
    const x = Number(v);
    return isNaN(x) ? 0 : x;
  };
  const total = n(meta.totalBudget) || n(meta.primeBudget);
  // Fall back through the schedule before defaulting: assuming a one-week
  // project makes every variance read as ~100% under budget.
  const weeks = n(meta.lengthWeeks) || (n(meta.lengthDays) ? Math.ceil(n(meta.lengthDays) / 7) : 0) || (n((p.sched || {}).days) ? Math.ceil(n(p.sched.days) / 7) : 0) || 0;
  const blim = meta.budgetVarianceLimit != null ? n(meta.budgetVarianceLimit) : 0.02;
  const tlim = meta.timeVarianceLimitPerWeek != null ? n(meta.timeVarianceLimitPerWeek) : 2;
  const wk = p._wk || [];
  const elapsed = wk.length ? Math.max(...wk.map(r => r.week_no)) : 0;
  const spend = wk.reduce((s, r) => s + n(r.spend), 0);
  const daysLost = wk.reduce((s, r) => s + n(r.days_lost), 0);
  // Compare spend against the weeks actually logged, not the highest week
  // number — a gap in the log would otherwise read as a large underrun.
  const logged = wk.length;
  const projected = weeks > 0 ? total / weeks * logged : 0;
  const cvar = projected > 0 ? (spend - projected) / projected : 0;
  const gap = elapsed > logged;
  const pa = p._pa || [];
  const paid = pa.reduce((s, r) => s + (r.paid ? n(r.work_completed) * (1 - n(r.retainage_pct)) : 0), 0);
  const reimb = pa.reduce((s, r) => s + n(r.reimb_amount), 0);
  const stop = cvar > blim || elapsed > 0 && daysLost > tlim * elapsed;
  const watch = !stop && cvar > blim * 0.6;
  return {
    total,
    weeks,
    elapsed,
    logged,
    gap,
    spend,
    daysLost,
    cvar,
    blim,
    tlim,
    carrying: paid - reimb,
    stop,
    watch,
    label: stop ? "Hard stop" : watch ? "Watch" : "On track"

}

function parseMunisCsv(text) {
  const table = [];
  let row = [], field = "", quoted = false;
  const pushField = () => { row.push(field); field = ""; };
  const pushRow = () => {
    if (row.some(v => String(v).trim() !== "")) table.push(row);
    row = [];
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") pushField();
    else if (ch === "\n") { pushField(); pushRow(); }
    else if (ch !== "\r") field += ch;
  }
  pushField(); pushRow();
  if (quoted) throw new Error("The CSV has an unfinished quoted value.");
  if (table.length < 2) throw new Error("The report needs a header row and at least one project row.");
  const clean = v => String(v || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  const headers = table[0].map(clean);
  return table.slice(1).map(cols => {
    const item = {};
    headers.forEach((h, i) => { if (h) item[h] = String(cols[i] ?? "").trim(); });
    return item;
  });
}

function munisValue(row, aliases) {
  for (const alias of aliases) {
    const key = alias.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (row[key] !== undefined && row[key] !== "") return row[key];
  }
  return "";
}

function munisMoney(value) {
  if (value === "" || value === null || value === undefined) return null;
  const raw = String(value).trim();
  const negative = /^\(.*\)$/.test(raw);
  const parsed = Number(raw.replace(/[$,()\s]/g, ""));
  if (!Number.isFinite(parsed)) return null;
  return negative ? -parsed : parsed;
}

function normalizeMunisRow(row) {
  return {
    projectNo: munisValue(row, ["munis_project_number", "munis project number", "project_number", "project no", "project id"]),
    title: munisValue(row, ["project_title", "project name", "description"]),
    budget: munisMoney(munisValue(row, ["revised_budget", "revised budget", "project budget", "budget"])),
    actual: munisMoney(munisValue(row, ["actual_spend", "actual expenditures", "expenditures", "spent", "ytd actual"])),
    encumbrances: munisMoney(munisValue(row, ["encumbrances", "encumbered", "open commitments"])),
    available: munisMoney(munisValue(row, ["available_balance", "available budget", "remaining balance"])),
    reportDate: munisValue(row, ["report_date", "as of date", "report date"])
  };
}

function munisKey(value) {
  return String(value || "").trim().toUpperCase().replace(/\s+/g, "");
}

// before filename — JMAA's numbered/lettered structure is a far better signal
// than whatever somebody happened to name the file.
const DOC_ROLES = [{
  role: "budget", label: "budget report",
  path: /e - budgets|c - opcs/, name: /project\s*detail|budget|opc|estimate/,
  gives: "budget by fund source, project number"
}, {
  role: "award", label: "notice of award",
  path: /b - contract documents|g - funding/, name: /notice\s*of\s*award|00\s*51\s*00/,
  gives: "contractor, award amount, project numbers"
}, {
  role: "contract", label: "construction contract",
  path: /b - contract documents/, name: /00\s*52\s*00|contract/,
  gives: "duration, liquidated damages, engineer"
}, {
  role: "taskorder", label: "engineering task order",
  path: /a - contracts|b - contract documents/, name: /task\s*order|ga\d+/,
  max: 2, // design and construction administration are separate task orders
  gives: "engineering fee, subconsultants"
}, {
  role: "grant_app", label: "grant application",
  path: /g - funding/, name: /app|application/,

  reject: /pre-?application/,

}, {
  role: "grant_agreement", label: "grant agreement",
  path: /g - funding|k - correspondence/, name: /grant\s*agreement|sog/,
  gives: "maximum obligation, period of performance"

  role: "board_memo", label: "board memo",
  path: /board memos/, name: /memo/,
